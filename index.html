<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AST Builder ULTIMATE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            width: 100%; 
            height: 100%; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        #gameContainer { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 6px 0;
        }
        #gameUI { 
            width: 100%; 
            max-width: 600px;
            pointer-events: none; 
            z-index: 10; 
            display: flex; 
            justify-content: space-between; 
            padding: 0 15px; 
            box-sizing: border-box; 
            flex-shrink: 0;
        }
        .ui-box { 
            background: rgba(30, 41, 59, 0.95); 
            padding: 4px 8px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            backdrop-filter: blur(4px); 
            font-size: 0.75rem;
        }
        h1 { margin: 0; color: #38bdf8; font-size: 0.8rem; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        h2 { margin: 2px 0 0 0; color: #cbd5e1; font-size: 0.65rem; font-family: monospace; }
        #timerDisplay { font-size: 0.8rem; font-weight: bold; color: #fbbf24; font-family: monospace;}
        
        .canvas-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2px 10px;
            overflow: hidden;
        }

        canvas { 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            border: 2px solid #38bdf8; 
            max-width: 100%; 
            max-height: 100%;
            object-fit: contain; 
            background: #0f172a;
        }
        
        .touch-controls { 
            width: 100%; 
            max-width: 600px;
            display: flex; 
            justify-content: space-between; 
            padding: 0 15px 12px 15px; 
            box-sizing: border-box; 
            z-index: 20; 
            flex-shrink: 0;
        }
        .touch-group { display: flex; gap: 14px; }
        .t-btn { 
            width: 52px; 
            height: 52px; 
            background: rgba(56, 189, 248, 0.28); 
            border: 2px solid rgba(56, 189, 248, 0.7); 
            border-radius: 50%; 
            color: white; 
            font-size: 1.1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            user-select: none; 
            backdrop-filter: blur(4px); 
            outline: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .t-btn:active { background: rgba(56, 189, 248, 0.6); transform: scale(0.95); }
        #buildBtn { background: rgba(245, 158, 11, 0.4); border-color: rgba(245, 158, 11, 0.8); font-size: 1rem; }

        #instructions { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 0.6rem; 
            padding-bottom: 2px;
            flex-shrink: 0;
        }
        kbd { background: #334155; padding: 2px 4px; border-radius: 3px; color: #38bdf8; font-family: monospace; }
        
        .overlay-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(15, 23, 42, 0.98); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(8px); 
        }
        .input-group { margin: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;}
        input[type="text"] { padding: 8px 12px; font-size: 1rem; border-radius: 8px; border: 2px solid #38bdf8; background: #1e293b; color: white; outline: none; text-align: center; width: 220px;}
        input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer; background: transparent;}
        input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: 2px solid #38bdf8; }
        button.start-action { background: #38bdf8; color: #0f172a; border: none; padding: 10px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 8px;}
        button.start-action:hover { background: #0284c7; color: white; transform: scale(1.05);}
        .hidden { display: none !important; opacity: 0; pointer-events: none;}
        
        #finalStats { background: #1e293b; padding: 12px; border-radius: 10px; border: 2px solid #10b981; text-align: center; margin-top: 8px;}
        #finalTimeStr { font-size: 1.8rem; color: #fbbf24; font-family: monospace; font-weight: bold; margin: 4px 0;}

        /* Ajustes específicos para Modo Horizontal (Landscape) en Móviles */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #gameContainer { padding: 2px 0; }
            .canvas-wrapper { padding: 0; height: calc(100vh - 65px); }
            canvas { max-height: calc(100vh - 68px); }
            .touch-controls { padding: 0 20px 4px 20px; }
            .t-btn { width: 42px; height: 42px; font-size: 0.95rem; }
            #instructions { display: none; }
            #gameUI { padding: 0 10px; }
            .ui-box { padding: 2px 6px; font-size: 0.65rem; }
            h1 { font-size: 0.75rem; }
            h2 { font-size: 0.55rem; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameUI" class="hidden">
            <div class="ui-box">
                <div>Ingeniero: <span id="playerNameDisplay" style="color:#38bdf8; font-weight:bold;"></span></div>
                <div id="timerDisplay">00:00.00</div>
            </div>
            <div class="ui-box" style="text-align:right;">
                <h1>Nivel <span id="lvlDisplay">1</span>/5</h1>
                <h2 id="expDisplay">Tema</h2>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="900" height="500"></canvas>
        </div>

        <div id="touchControls" class="touch-controls hidden">
            <div class="touch-group">
                <button class="t-btn" id="leftBtn">◀</button>
                <button class="t-btn" id="rightBtn">▶</button>
            </div>
            <div class="touch-group">
                <button class="t-btn" id="buildBtn">🧱</button>
                <button class="t-btn" id="jumpBtn">▲</button>
            </div>
        </div>

        <div id="instructions" class="hidden">
            PC: <kbd>←</kbd> <kbd>→</kbd> Mover | <kbd>↑</kbd> Saltar | <kbd>Click</kbd> / <kbd>🧱</kbd> Construir
        </div>

        <!-- Pantalla Inicio -->
        <div id="startScreen" class="overlay-screen">
            <h1 style="font-size: 2rem; margin-bottom: 6px; color:#38bdf8;">AST Builder <span style="color:#ef4444">ULTIMATE</span></h1>
            <p style="color: #94a3b8; margin-bottom: 10px; max-width: 340px; font-size: 0.8rem; line-height: 1.3;">
                Compatible con Vertical y Horizontal.<br><strong>Usa botones virtuales o toca el lienzo para construir 🧱.</strong>
            </p>
            <div class="input-group">
                <input type="text" id="playerNameInput" placeholder="Tu Nombre" autocomplete="off" value="Estudiante">
            </div>
            <div class="input-group">
                <label style="color:#cbd5e1; font-size:0.8rem;">Pinta tu Cubo:</label>
                <input type="color" id="playerColorInput" value="#10b981">
            </div>
            <button class="start-action" id="startBtn">Comenzar Examen</button>
        </div>

        <!-- Pantalla Final -->
        <div id="endScreen" class="overlay-screen hidden">
            <h1 style="font-size: 1.8rem; color: #10b981; text-shadow: 0 0 20px rgba(16,185,129,0.5);">¡Ingeniería Dominada!</h1>
            <div id="finalStats">
                <h2 style="color: #e2e8f0; font-size: 0.9rem;">Tiempo Total de <span id="finalNameDisplay"></span>:</h2>
                <div id="finalTimeStr">00:00.00</div>
                <p style="color: #94a3b8; font-size: 0.75rem;">¡Has superado el desafío definitivo!</p>
            </div>
            <button class="start-action" onclick="location.reload()">Nuevo Intento</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'start'; 
        let startTime = 0;
        let currentLevel = 0;
        let shakeFrames = 0;
        let userBlocks = []; 
        
        const player = { 
            x: 50, y: 0, w: 24, h: 24, vx: 0, vy: 0, 
            speed: 5.5, jumpPower: -11.5, color: '#10b981', baseColor: '#10b981',
            scaleX: 1, scaleY: 1
        };
        const gravity = 0.58;
        const keys = { ArrowLeft: false, ArrowRight: false };
        let upPressed = false; 
        
        let platforms = []; 
        let movingPlatforms = [];
        let walls = [];     
        let hazards = [];
        let spikes = [];

        const questionsDb = {
            prec1: { exp: "Precedencia: 2 + 3 * 4", ans: [ { text: "(2+3)*4", isCorrect: false }, { text: "2+(3*4)", isCorrect: true } ] },
            prec2: { exp: "Precedencia: a / b + c", ans: [ { text: "a/(b+c)", isCorrect: false }, { text: "(a/b)+c", isCorrect: true } ] },
            asoc1: { exp: "Asociatividad: x - y - z", ans: [ { text: "x-(y-z)", isCorrect: false }, { text: "(x-y)-z", isCorrect: true } ] },
            asoc2: { exp: "Asociatividad: 2 ^ 3 ^ 2", ans: [ { text: "(2^3)^2", isCorrect: false }, { text: "2^(3^2)", isCorrect: true } ] },
            gram1: { exp: "Regla: A -> A α | β", ans: [ { text: "Bucle Infinito", isCorrect: true }, { text: "Gramática OK", isCorrect: false } ] },
            gram2: { exp: "Regla: A -> α B | α C", ans: [ { text: "Factorización", isCorrect: true }, { text: "Sin Ambigüedad", isCorrect: false } ] },
            dangl: { exp: "Problema: Dangling Else", ans: [ { text: "Ambigüedad", isCorrect: true }, { text: "Error Léxico", isCorrect: false } ] },
            ast: { exp: "AST (Árbol de Sintaxis)", ans: [ { text: "Omite tokens ( )", isCorrect: true }, { text: "Incluye todo", isCorrect: false } ] }
        };

        const levels = [
            { 
                bgTop: "#0f172a", bgBot: "#1e1b4b", spawn: { x: 40, y: 400 },
                pools: [questionsDb.prec1, questionsDb.prec2],
                answerPositions: [ {x: 130, y: 260}, {x: 580, y: 260} ],
                walls: [ { x: 400, y: 280, w: 70, h: 220 } ],
                grounds: [ { x: 0, y: 460, w: 220, h: 20 }, { x: 680, y: 460, w: 220, h: 20 } ],
                hazards: [], spikes: []
            },
            { 
                bgTop: "#17153b", bgBot: "#022c22", spawn: { x: 40, y: 400 },
                pools: [questionsDb.asoc1, questionsDb.asoc2],
                answerPositions: [ {x: 540, y: 320}, {x: 540, y: 160} ],
                walls: [ { x: 180, y: 0, w: 35, h: 380 }, { x: 380, y: 120, w: 35, h: 380 } ], 
                grounds: [ { x: 0, y: 460, w: 130, h: 20 } ],
                hazards: [ { x: 280, y: 230, size: 22, range: 120, axis: 'y', speed: 3, start: 230 } ],
                spikes: []
            },
            { 
                bgTop: "#2a0a18", bgBot: "#0f172a", spawn: { x: 40, y: 90 },
                pools: [questionsDb.gram1, questionsDb.gram2],
                answerPositions: [ {x: 130, y: 340}, {x: 580, y: 340} ],
                walls: [ { x: 0, y: 200, w: 100, h: 300 }, { x: 800, y: 200, w: 100, h: 300 } ],
                grounds: [ { x: 0, y: 130, w: 130, h: 20 } ],
                movingGrounds: [ 
                    { x: 150, y: 200, w: 80, h: 16, range: 100, axis: 'y', speed: 2, start: 200, dir: 1 },
                    { x: 460, y: 270, w: 90, h: 16, range: 100, axis: 'x', speed: 2.5, start: 460, dir: 1 }
                ],
                hazards: [],
                spikes: [ { x: 100, y: 485, width: 700, count: 20 } ]
            },
            { 
                bgTop: "#022c22", bgBot: "#0f172a", spawn: { x: 40, y: 400 },
                pools: [questionsDb.dangl, questionsDb.prec1],
                answerPositions: [ {x: 600, y: 260}, {x: 240, y: 180} ],
                walls: [ { x: 310, y: 260, w: 30, h: 200 }, { x: 550, y: 160, w: 30, h: 200 } ],
                grounds: [ { x: 0, y: 460, w: 100, h: 20 } ],
                movingGrounds: [ { x: 400, y: 340, w: 70, h: 16, range: 80, axis: 'x', speed: 2, start: 400, dir: 1 } ],
                hazards: [ { x: 440, y: 230, size: 20, range: 60, axis: 'y', speed: 2.5, start: 230 } ],
                spikes: [ { x: 310, y: 260, width: 30, count: 1 }, { x: 550, y: 160, width: 30, count: 1 } ]
            },
            { 
                bgTop: "#311024", bgBot: "#000000", spawn: { x: 410, y: 400 },
                pools: [questionsDb.ast, questionsDb.gram2],
                answerPositions: [ {x: 100, y: 300}, {x: 620, y: 300} ],
                walls: [ { x: 260, y: 150, w: 30, h: 240 }, { x: 600, y: 150, w: 30, h: 240 } ],
                grounds: [ { x: 360, y: 460, w: 180, h: 20 } ],
                movingGrounds: [ { x: 380, y: 240, w: 120, h: 16, range: 90, axis: 'x', speed: 2, start: 380, dir: 1 } ],
                hazards: [ { x: 440, y: 100, size: 22, range: 80, axis: 'y', speed: 3, start: 100 } ],
                spikes: [ { x: 260, y: 390, width: 30, count: 1 }, { x: 600, y: 390, width: 30, count: 1 } ]
            }
        ];

        window.addEventListener('keydown', e => { 
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true; 
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!keys.ArrowUpPress) upPressed = true; 
                keys.ArrowUpPress = true;
            }
        });
        window.addEventListener('keyup', e => { 
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false; 
            if (e.key === 'ArrowUp') keys.ArrowUpPress = false;
        });

        const setupTouchButton = (id, actionStart, actionEnd) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionStart(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); actionEnd(); });
            btn.addEventListener('mousedown', (e) => { actionStart(); });
            btn.addEventListener('mouseup', (e) => { actionEnd(); });
        };

        setupTouchButton('leftBtn', () => keys.ArrowLeft = true, () => keys.ArrowLeft = false);
        setupTouchButton('rightBtn', () => keys.ArrowRight = true, () => keys.ArrowRight = false);
        setupTouchButton('jumpBtn', () => upPressed = true, () => {});

        document.getElementById('buildBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            spawnBlockAtCenter();
        });
        document.getElementById('buildBtn').addEventListener('click', (e) => {
            spawnBlockAtCenter();
        });

        function spawnBlockAtCenter() {
            if (gameState !== 'playing' && gameState !== 'falling_wrong') return;
            if(userBlocks.length >= 5) userBlocks.shift();
            let bx = player.x + (player.vx >= 0 ? 45 : -65);
            let by = player.y + 35;
            userBlocks.push({ x: bx, y: by, w: 55, h: 12, life: 240, maxLife: 240 });
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'playing' && gameState !== 'falling_wrong') return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            if(userBlocks.length >= 5) userBlocks.shift(); 
            userBlocks.push({ x: mouseX - 28, y: mouseY - 6, w: 55, h: 12, life: 240, maxLife: 240 });
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            const name = document.getElementById('playerNameInput').value.trim() || "Estudiante";
            player.baseColor = document.getElementById('playerColorInput').value;
            player.color = player.baseColor;
            
            document.getElementById('playerNameDisplay').innerText = name;
            document.getElementById('finalNameDisplay').innerText = name;
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');
            document.getElementById('instructions').classList.remove('hidden');
            document.getElementById('touchControls').classList.remove('hidden');
            
            currentLevel = 0;
            startTime = Date.now();
            gameState = 'playing';
            initLevel();
            requestAnimationFrame(gameLoop);
        });

        function initLevel() {
            if (currentLevel >= levels.length) {
                gameState = 'end';
                document.getElementById('finalTimeStr').innerText = document.getElementById('timerDisplay').innerText;
                document.getElementById('endScreen').classList.remove('hidden');
                document.getElementById('gameUI').classList.add('hidden');
                document.getElementById('touchControls').classList.add('hidden');
                return;
            }

            const lvl = levels[currentLevel];
            const currentQ = lvl.pools[Math.floor(Math.random() * lvl.pools.length)];

            let coords = [...lvl.answerPositions];
            if (Math.random() > 0.5) coords.reverse();

            document.getElementById('lvlDisplay').innerText = currentLevel + 1;
            document.getElementById('expDisplay').innerText = currentQ.exp;
            gameState = 'playing';
            userBlocks = []; 
            player.color = player.baseColor;
            
            player.x = lvl.spawn.x; player.y = lvl.spawn.y;
            player.vx = 0; player.vy = 0;
            player.scaleX = 1; player.scaleY = 1;

            walls = lvl.walls.map(w => ({ ...w }));
            hazards = lvl.hazards ? lvl.hazards.map(h => ({ ...h, angle: 0, dir: 1 })) : [];
            movingPlatforms = lvl.movingGrounds ? lvl.movingGrounds.map(m => ({ ...m, type: 'moving' })) : [];
            spikes = lvl.spikes ? lvl.spikes.map(s => ({ ...s })) : [];
            
            platforms = [
                ...lvl.grounds.map(g => ({ ...g, type: 'ground', isActive: true })),
                { text: currentQ.ans[0].text, isCorrect: currentQ.ans[0].isCorrect, x: coords[0].x, y: coords[0].y, w: 160, h: 32, type: 'answer', isActive: true, baseY: coords[0].y, floatTimer: Math.random() * 10, alpha: 1 },
                { text: currentQ.ans[1].text, isCorrect: currentQ.ans[1].isCorrect, x: coords[1].x, y: coords[1].y, w: 160, h: 32, type: 'answer', isActive: true, baseY: coords[1].y, floatTimer: Math.random() * 10, alpha: 1 }
            ];
        }

        function isColliding(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function circleRectCollide(cx, cy, radius, rx, ry, rw, rh) {
            let testX = cx; let testY = cy;
            if (cx < rx) testX = rx; else if (cx > rx + rw) testX = rx + rw;
            if (cy < ry) testY = ry; else if (cy > ry + rh) testY = ry + rh;
            let distX = cx - testX; let distY = cy - testY;
            return (distX*distX + distY*distY) <= (radius*radius);
        }

        function spikeCollide(player, s) {
            return player.x < s.x + s.width && player.x + player.w > s.x && player.y + player.h > s.y - 12 && player.y < s.y;
        }

        function die(shake = true) {
            player.color = '#ef4444'; 
            player.vy = -4; 
            gameState = 'falling_wrong';
            if(shake) shakeFrames = 12;
        }

        function update() {
            if (gameState !== 'start' && gameState !== 'end') {
                let date = new Date(Date.now() - startTime);
                document.getElementById('timerDisplay').innerText = 
                    `${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}.${Math.floor(date.getMilliseconds()/10).toString().padStart(2, '0')}`;
            }
            if (gameState === 'start' || gameState === 'end') return;

            userBlocks.forEach(b => b.life--);
            userBlocks = userBlocks.filter(b => b.life > 0);

            hazards.forEach(h => {
                h.angle += 0.2; 
                if (h.range > 0) {
                    if (h.axis === 'x') {
                        h.x += h.speed * h.dir;
                        if (Math.abs(h.x - h.start) >= h.range) h.dir *= -1;
                    } else {
                        h.y += h.speed * h.dir;
                        if (Math.abs(h.y - h.start) >= h.range) h.dir *= -1;
                    }
                }
                if (gameState === 'playing' && circleRectCollide(h.x, h.y, h.size - 4, player.x, player.y, player.w, player.h)) die();
            });

            if (gameState === 'playing') {
                spikes.forEach(s => {
                    if (spikeCollide(player, s)) die();
                });
            }

            movingPlatforms.forEach(m => {
                if (m.axis === 'x') {
                    m.x += m.speed * m.dir;
                    if (Math.abs(m.x - m.start) >= m.range) m.dir *= -1;
                } else {
                    m.y += m.speed * m.dir;
                    if (Math.abs(m.y - m.start) >= m.range) m.dir *= -1;
                }
            });

            platforms.forEach(p => {
                if (p.type === 'answer') {
                    if (p.isActive) {
                        p.floatTimer += 0.05;
                        p.y = p.baseY + Math.sin(p.floatTimer) * 4; 
                    } else {
                        p.y += 8;
                        p.alpha = Math.max(0, p.alpha - 0.05);
                    }
                }
            });

            if (keys.ArrowLeft) player.vx -= 1.1;
            if (keys.ArrowRight) player.vx += 1.1;
            if (player.vx > player.speed) player.vx = player.speed;
            if (player.vx < -player.speed) player.vx = -player.speed;
            player.vx *= 0.8; 

            player.x += player.vx;
            let onWall = 0; 

            if (gameState === 'playing') {
                walls.forEach(w => {
                    if (isColliding(player, w)) {
                        if (player.vx > 0) { player.x = w.x - player.w; onWall = 1; }
                        else if (player.vx < 0) { player.x = w.x + w.w; onWall = -1; }
                        player.vx = 0;
                    }
                });
                if (player.x < 0) { player.x = 0; player.vx = 0; }
                if (player.x + player.w > canvas.width) { player.x = canvas.width - player.w; player.vx = 0; }
            }

            let prevBottom = player.y + player.h - player.vy; 
            player.vy += gravity;
            if (onWall !== 0 && player.vy > 0) player.vy *= 0.7; 
            player.y += player.vy;

            if (player.y < 0) {
                player.y = 0;
                if (player.vy < 0) player.vy = 0; 
            }

            let grounded = false;

            if (gameState === 'playing') {
                walls.forEach(w => {
                    if (isColliding(player, w)) {
                        if (player.vy > 0) { player.y = w.y - player.h; player.vy = 0; grounded = true; }
                        else if (player.vy < 0) { player.y = w.y + w.h; player.vy *= -0.5; }
                    }
                });

                const oneWays = [...platforms, ...movingPlatforms, ...userBlocks];
                oneWays.forEach(p => {
                    if (p.isActive === false) return; 
                    if (player.vy >= 0 && player.x < p.x + p.w && player.x + player.w > p.x) {
                        if (prevBottom <= p.y + 10 && player.y + player.h >= p.y) {
                            if (p.type === 'answer') {
                                p.isActive = false; 
                                player.vy = 3; 
                                if (p.isCorrect) {
                                    p.status = 'correct';
                                    gameState = 'transitioning';
                                } else {
                                    p.status = 'wrong';
                                    die(false);
                                }
                            } else {
                                player.y = p.y - player.h;
                                player.vy = 0;
                                grounded = true;
                                if (p.type === 'moving' && p.axis === 'x') {
                                    player.x += p.speed * p.dir;
                                }
                            }
                        }
                    }
                });
            }

            if (player.y > canvas.height + 40) {
                if (gameState === 'transitioning') {
                    currentLevel++;
                    initLevel(); 
                } else {
                    shakeFrames = 12;
                    initLevel(); 
                }
            }

            if (upPressed && gameState === 'playing') {
                if (grounded) {
                    player.vy = player.jumpPower;
                    player.scaleX = 0.75; player.scaleY = 1.25;
                } else if (onWall !== 0) {
                    player.vy = player.jumpPower * 0.95;
                    player.vx = onWall === 1 ? -11.5 : 11.5; 
                    player.scaleX = 0.75; player.scaleY = 1.25;
                }
                upPressed = false; 
            }

            if (grounded) {
                player.scaleX += (1 - player.scaleX) * 0.3;
                player.scaleY += (1 - player.scaleY) * 0.3;
            } else {
                player.scaleX += (0.85 - player.scaleX) * 0.1;
                player.scaleY += (1.15 - player.scaleY) * 0.1;
            }
        }

        function draw() {
            if (gameState === 'start') return;
            const lvl = levels[currentLevel];

            ctx.save();
            if (shakeFrames > 0) {
                ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
                shakeFrames--;
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, lvl.bgTop);
            gradient.addColorStop(1, lvl.bgBot);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            walls.forEach(w => {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            spikes.forEach(s => {
                ctx.fillStyle = '#cbd5e1';
                let spikeW = s.width / s.count;
                for(let i=0; i<s.count; i++) {
                    ctx.beginPath();
                    ctx.moveTo(s.x + (i * spikeW), s.y);
                    ctx.lineTo(s.x + (i * spikeW) + (spikeW / 2), s.y - 12);
                    ctx.lineTo(s.x + ((i + 1) * spikeW), s.y);
                    ctx.fill();
                }
            });

            userBlocks.forEach(b => {
                const opacity = Math.min(1, b.life / 50); 
                ctx.globalAlpha = opacity;
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = (b.life < 50 && b.life % 8 < 4) ? '#ef4444' : '#b45309';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
                ctx.globalAlpha = 1;
            });

            movingPlatforms.forEach(m => {
                ctx.fillStyle = '#64748b';
                ctx.fillRect(m.x, m.y, m.w, m.h);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.strokeRect(m.x, m.y, m.w, m.h);
            });

            platforms.forEach(p => {
                ctx.globalAlpha = p.alpha !== undefined ? p.alpha : 1;
                
                if (p.type === 'ground') {
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = '#64748b';
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                } else if (p.type === 'answer') {
                    if (p.status === 'correct') ctx.fillStyle = '#10b981'; 
                    else if (p.status === 'wrong') ctx.fillStyle = '#ef4444';
                    else ctx.fillStyle = '#38bdf8'; 

                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = '#bae6fd';
                    if (p.status) ctx.strokeStyle = 'transparent';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);

                    if (p.text) {
                        ctx.fillStyle = '#0f172a';
                        ctx.font = 'bold 14px monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(p.text, p.x + p.w / 2, p.y + p.h / 2);
                    }
                }
                ctx.globalAlpha = 1;
            });

            hazards.forEach(h => {
                ctx.save();
                ctx.translate(h.x, h.y);
                ctx.rotate(h.angle);
                ctx.fillStyle = '#cbd5e1';
                for(let i=0; i<8; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.beginPath();
                    ctx.moveTo(-4, -h.size + 8);
                    ctx.lineTo(4, -h.size + 8);
                    ctx.lineTo(0, -h.size - 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(0, 0, h.size - 4, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h); 
            ctx.scale(player.scaleX, player.scaleY);
            
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = (gameState === 'transitioning') ? 25 : 10; 
            ctx.fillRect(-player.w / 2, -player.h, player.w, player.h); 
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            let eyeOffset = player.vx > 1 ? 3 : (player.vx < -1 ? -3 : 0);
            ctx.fillRect(-player.w / 2 + 4 + eyeOffset, -player.h + 5, 3, 6);
            ctx.fillRect(-player.w / 2 + 15 + eyeOffset, -player.h + 5, 3, 6);
            
            ctx.restore(); 
            ctx.restore(); 
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
